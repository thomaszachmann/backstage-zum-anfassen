apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: node-service
  title: Node.js-Service
  description: Neuer Node.js-Service mit Repo in Forgejo und Katalog-Eintrag
  tags: [nodejs, kranich]
spec:
  owner: plattform
  type: service
  parameters:
    - title: Service
      required: [name, description, owner]
      properties:
        name:
          title: Name
          type: string
          description: Kleinbuchstaben, Ziffern, Bindestriche (z. B. lager-api)
          pattern: '^[a-z][a-z0-9-]{2,30}$'
          ui:autofocus: true
        description:
          title: Beschreibung
          type: string
          description: Ein Satz – erscheint in Forgejo und im Katalog
        owner:
          title: Owner
          type: string
          description: Team, das den Service betreut
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
              spec.type: team
        port:
          title: Port
          type: integer
          description: HTTP-Port des Service
          default: 8080
          minimum: 1024
          maximum: 65535
    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Ablageort
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: ['127.0.0.1:3300']
            allowedOwners: [kranich]
  steps:
    - id: fetch
      name: Skeleton füllen
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}
    - id: publish
      name: Repo in Forgejo anlegen
      action: publish:gitea
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        gitCommitMessage: Erzeugt aus Template node-service
        gitAuthorName: Backstage Scaffolder
        gitAuthorEmail: backstage-bot@lab.local
    - id: register
      name: Im Katalog registrieren
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: catalog-info.yaml
  output:
    links:
      - title: Repository in Forgejo
        url: ${{ steps.publish.output.repoContentsUrl }}
      - title: Im Katalog öffnen
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
