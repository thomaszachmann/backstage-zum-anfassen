apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  tags: [nodejs]
{%- if values.techdocs %}
  annotations:
    backstage.io/techdocs-ref: dir:.
{%- endif %}
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ${{ values.system }}
