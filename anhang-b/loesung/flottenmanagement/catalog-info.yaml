# catalog-info.yaml – Domain Fuhrpark (Anhang B, Aufgabe 2 und 3)
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: fuhrpark
  title: Fuhrpark
  description: Fahrzeuge, Touren und Fahrtenbücher der Kranich Logistik
spec:
  owner: team-fuhrpark
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: flottenmanagement
  title: Flottenmanagement
  description: Welches Fahrzeug ist wo, wann muss es in die Werkstatt?
spec:
  owner: team-fuhrpark
  domain: fuhrpark
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: fahrzeug-db
  description: PostgreSQL mit Stammdaten und Kilometerständen aller Fahrzeuge
spec:
  type: database
  owner: team-fuhrpark
  system: flottenmanagement
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: fahrzeug-api
  description: Fahrzeugdaten für Disposition und Fahrtenbuch
spec:
  type: openapi
  lifecycle: experimental
  owner: team-fuhrpark
  system: flottenmanagement
  definition:
    $text: ./openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fahrzeug-api
  description: REST-Service für Fahrzeugstammdaten
  tags: [nodejs, rest]
spec:
  type: service
  lifecycle: experimental
  owner: team-fuhrpark
  system: flottenmanagement
  providesApis: [fahrzeug-api]
  dependsOn: [resource:fahrzeug-db]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fahrtenbuch-web
  description: Digitales Fahrtenbuch für Fahrerinnen und Fahrer
  tags: [web]
spec:
  type: website
  lifecycle: experimental
  owner: team-fuhrpark
  system: flottenmanagement
  consumesApis: [fahrzeug-api]
